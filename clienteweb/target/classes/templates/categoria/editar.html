<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layouts/principal}">
<div layout:fragment="contenido">
    <h1>Editar Categoría</h1>
    <div class="card"><div class="card-body">
        <form th:action="@{/categoria}" th:object="${categoria}" method="post">
            <input type="hidden" th:field="*{idCategoria}">
            <div class="mb-3"><label class="form-label">Nombre</label>
                <input type="text" th:field="*{categoriaNombre}" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Descripción</label>
                <input type="text" th:field="*{categoriaDescripcion}" class="form-control"></div>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
            <a th:href="@{/categoria}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div></div>
</div>
</html>
