<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrito | Twins Burger</title>
<link rel="stylesheet" th:href="@{/core/dist/css/tabler.css}"></head><body><div class="page">
<header class="navbar navbar-dark bg-dark"><div class="container-xl"><a class="navbar-brand" th:href="@{/menu}">Twins Burger</a><a class="btn btn-outline-light" th:href="@{/menu}">Seguir comprando</a></div></header>
<main class="page-wrapper"><div class="page-header"><div class="container-xl"><h1 class="page-title">Tu carrito</h1></div></div>
<div class="page-body"><div class="container-xl">
<div th:if="${param.compraExitosa}" class="alert alert-success">Compra registrada. El stock fue actualizado automáticamente.</div>
<div th:if="${param.errorCompra}" class="alert alert-danger">No se pudo confirmar. Puede que el stock haya cambiado; vuelve al menú y revisa.</div>
<div th:if="${param.errorCantidad}" class="alert alert-warning">Cantidad inválida.</div>
<div th:if="${#lists.isEmpty(items) and param.compraExitosa == null}" class="empty"><p class="empty-title">El carrito está vacío</p><a class="btn btn-primary" th:href="@{/menu}">Ver menú</a></div>
<div class="card" th:unless="${#lists.isEmpty(items)}"><div class="table-responsive"><table class="table card-table table-vcenter">
<thead><tr><th>Producto</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th></th></tr></thead><tbody>
<tr th:each="item : ${items}"><td th:text="${item.nombre}">Producto</td><td th:text="${'$' + #numbers.formatDecimal(item.precio,1,2)}">$0</td>
<td><form class="d-flex gap-2" th:action="@{/carrito/actualizar-articulo/{clave}(clave=${item.clave})}" method="post"><input class="form-control" style="width:90px" type="number" name="cantidad" min="1" th:max="${item.stockDisponible}" th:value="${item.cantidad}"><button class="btn btn-outline-primary">Actualizar</button></form></td>
<td class="fw-bold" th:text="${'$' + #numbers.formatDecimal(item.subtotal,1,2)}">$0</td><td><form th:action="@{/carrito/eliminar-articulo/{clave}(clave=${item.clave})}" method="post"><button class="btn btn-outline-danger">Quitar</button></form></td></tr>
</tbody></table></div><div class="card-footer d-flex align-items-end gap-3 flex-wrap"><strong class="fs-2 me-auto" th:text="${'Total: $' + #numbers.formatDecimal(total,1,2)}">Total</strong><form class="d-flex align-items-end gap-2 flex-wrap" th:action="@{/carrito/confirmar}" method="post"><div><label for="idMetodoPago" class="form-label">Método de pago</label><select id="idMetodoPago" name="idMetodoPago" class="form-select" required><option value="" selected disabled>Selecciona una opción</option><option th:each="metodo : ${metodosPago}" th:value="${metodo.idMetodoPago}" th:text="${metodo.mpagoDescripcion}">Efectivo</option></select></div><button class="btn btn-success btn-lg">Confirmar compra</button></form></div></div>
</div></div></main></div></body></html>
