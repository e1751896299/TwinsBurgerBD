<!DOCTYPE html>
<html
xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layouts/principal}">

<div layout:fragment="contenido">

    <h1>Bienvenido</h1>

    <div class="card">
    		<div class="card-header">
    
    <div class="row align-items-center g-3 w-100">
				<div class="col-12 col-lg-3">
					<h3 class="card-title mb-0">
						Pedidos
					</h3>
					<p class="text-secondary m-0">
						Lista de pedidos
					</p>
				</div>

				<div class="col-12 col-lg-6">
					<div class="d-flex justify-content-center">
						<div class="input-group input-group-flat w-100" style="max-width: 420px;">
							<span class="input-group-text">
								<!-- Download SVG icon from http://tabler.io/icons/icon/search -->
	<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-1"><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>
							</span>

							<input id="advanced-table-search" type="text" class="form-control"
								placeholder="Buscar # de pedido..." aria-label="Buscar # pedido"
								autocomplete="off">
						</div>
					</div>
				</div>
			</div>
			</div>
        <div class="advance-table">
            <table class="table table-vcenter table-hover card-table text-nowrap">
                <thead>
                    <tr>
                        <th class="border-end">Pedido</th>
                        <th class="border-end">Fecha pedido</th>
                        <th  class="border-end">Estado</th>
                        <th  class="border-end">Total</th>
                        <th class="text-center">Detalle</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pedido : ${pedidos}">
                        <td class="fw-semibold" th:text="${'PED-' + #numbers.formatInteger(pedido.idPedido, 3)}"></td>
                        <td th:text="${#dates.format(pedido.pedidoFechaPedido, 'dd/MM/yyyy')}"></td>
                        <td>

						    <form
						        th:action="@{/pedido/{id}/estado(id=${pedido.idPedido})}"
						        method="post"
						        class="d-flex gap-2">
						
						        <select
						            name="estado"
						            class="form-select"
						            th:disabled="${pedido.pedidoEstadoProceso
						                == 'ENTREGADO'
						                or pedido.pedidoEstadoProceso
						                == 'CANCELADO'}">
						
						            <option
						                th:value="${pedido.pedidoEstadoProceso}"
						                th:text="${pedido.pedidoEstadoProceso}"
						                selected>
						                PENDIENTE
						            </option>
						
						            <option
						                th:if="${pedido.pedidoEstadoProceso
						                    == null
						                    or pedido.pedidoEstadoProceso
						                    == 'PENDIENTE'}"
						                value="EN_PREPARACION">
						                En preparación
						            </option>
						
						            <option
						                th:if="${pedido.pedidoEstadoProceso
						                    == null
						                    or pedido.pedidoEstadoProceso
						                    == 'PENDIENTE'
						                    or pedido.pedidoEstadoProceso
						                    == 'EN_PREPARACION'}"
						                value="CANCELADO">
						                Cancelado
						            </option>
						
						            <option
						                th:if="${pedido.pedidoEstadoProceso
						                    == 'EN_PREPARACION'}"
						                value="LISTO">
						                Listo
						            </option>
						
						            <option
						                th:if="${pedido.pedidoEstadoProceso
						                    == 'LISTO'}"
						                value="ENTREGADO">
						                Entregado
						            </option>
						
						        </select>
						
						        <button
						            type="submit"
						            class="btn btn-primary"
						            th:disabled="${pedido.pedidoEstadoProceso
						                == 'ENTREGADO'
						                or pedido.pedidoEstadoProceso
						                == 'CANCELADO'}">
						            Cambiar
						        </button>
						
						    </form>
						</td>
						
                        <td th:text="${pedido.pedidoTotal}"> </td>
                        <td class="text-center"><a class="btn btn-sm btn-outline-primary"
                            th:href="@{/pedido/{id}/detalle(id=${pedido.idPedido})}">Ver detalle</a></td>
                       
                        
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</html>
