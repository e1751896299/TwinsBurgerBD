<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/principal}">

	<div layout:fragment="contenido">
		
		  <div class="col-12">
		
   			 <h1>Bienvenido</h1>
		
		<div class="card">
				<div class="card-header">
		
		
		<div class="row align-items-center g-3 w-100">
			<div class="col-12 col-lg-6">
			<h1 class="card-title mb-0">
				Combos
			</h1>
			<p class="text-secondary m-0">
				Lista de combos
			</p>
			</div>
			<div class="col-12 col-lg-6 d-flex justify-content-center justify-content-lg-end">
			<a class="btn btn-primary" th:href="@{/combo/nuevo}">Nuevo
				combo</a>
				</div>	
		</div>
		<div th:if="${param.guardado}" class="alert alert-success">Combo
			guardado correctamente.</div>
		<div th:if="${param.errorGuardado}" class="alert alert-danger">No
			se pudo modificar el combo. Si ya fue vendido, desactívalo y crea una
			nueva versión.</div>
		</div>
		</div>
		<div class="card">
			<div class="table-responsive">
				<table class="table card-table table-vcenter">
					<thead>
						<tr>
							<th class="border-end">Imagen</th>
							<th class="border-end">Nombre</th>
							<th class="border-end">Incluye</th>
							<th class="border-end">Precio</th>
							<th class="border-end">Stock posible</th>
							<th class="border-end">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="c : ${combos}">
							
							<td class="border-end">
            <img
                th:if="${c.comboImagen != null and !c.comboImagen.isBlank()}"
                th:src="${c.comboImagen}"
                th:alt="${c.comboNombre}"
                class="avatar avatar-md rounded">

            <span
                th:if="${c.comboImagen == null or c.comboImagen.isBlank()}"
                class="avatar avatar-md bg-secondary-lt">
                TB
            </span>
        </td>
        
							<td class="sort-nombre border-end align-middle fw-semibold">
							<strong th:text="${c.comboNombre}">
							Combo
							</strong>
							<div class="text-secondary" th:text="${c.comboDescripcion}">
							</div>
							</td>
							
							<td class="sort-incluye border-end align-middle text-secondary">
							<span th:each="p,st : ${c.productos}"
								th:text="${p.cantidad + ' x ' + p.prodNombre + (!st.last ? ', ' : '')}"></span></td>
							<td class="sort-precio border-end align-middle text-secondary"
								th:text="${'$' + #numbers.formatDecimal(c.comboPrecio,1,2)}"></td>
							<td class="sort-stock border-end align-middle text-secondary" 
								th:text="${c.comboStockDisponible}"></td>
							
							<td class="text-center align-middle">
            <div class="d-inline-flex align-items-center gap-4">

                <a
                    th:href="@{/combo/editar/{id}(id=${c.idCombo})}"
                    class="btn btn-sm btn-outline-primary"
                    title="Editar combo">

                    <img
                        th:src="@{/core/dist/icons/edit.svg}"
                        width="20"
                        height="20"
                        alt="Editar">
                </a>

                <form
				    th:action="@{/combo/eliminar/{id}
				        (id=${c.idCombo})}"
				    method="post"
				    class="d-inline">
				
				    <button
				        type="submit"
				        class="btn btn-sm btn-outline-danger"
				        title="Desactivar combo"
				        onclick="return confirm(
				            '¿Deseas desactivar este combo?'
				        )">
				
				        <img
				            th:src="@{/core/dist/icons/trash.svg}"
				            width="20"
				            height="20"
				            alt="Desactivar">
				
				    </button>
				
				</form>
            </div>
        </td>		
						</tr>
					</tbody>
				</table>
			</div>
		</div>
		</div>
	</div>
	
<script
    th:src="@{/core/dist/libs/list.js/dist/list.min.js}">
</script>

<script>
    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const contenedor =
                document.getElementById(
                    "advanced-table"
                );

            const cuerpoTabla =
                contenedor?.querySelector(
                    ".table-tbody"
                );

            if (!contenedor
                    || !cuerpoTabla
                    || typeof List === "undefined") {

                return;
            }

            const list = new List(
                "advanced-table",
                {
                    sortClass: "table-sort",
                    listClass: "table-tbody",

                    page: 10000,

                    valueNames: [
                        "sort-nombre",
                        "sort-incluye",
                        "sort-precio",
                        "sort-stock",
                        "sort-categoria",
                    ]
                }
            );

            const searchInput =
                document.getElementById(
                    "advanced-table-search"
                );

            if (searchInput) {

                searchInput.addEventListener(
                    "input",
                    function () {

                        list.search(
                            searchInput.value
                        );
                    }
                );
            }
        }
    );
</script>
</html>
