 <!DOCTYPE html>
<html
xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layouts/principal}">

<div layout:fragment="contenido">

    <h1>Bienvenido</h1>


    <div class="card">
    <div class="card-header">
			<div class="row align-items-center g-3 w-100">
				<div class="col-12 col-lg-4">
					<h3 class="card-title mb-0">
						Horarios de Retiro
					</h3>
					<p class="text-secondary m-0">
						Lista de horarios para el retiro de pedidos
					</p>
				</div>

				<div class="col-12 col-lg-5">
					<div class="d-flex justify-content-center">
						<div class="input-group input-group-flat w-100" style="max-width: 420px;">
								
						</div>
					</div>
				</div>

				<div class="col-12 col-lg-3 d-flex justify-content-center justify-content-lg-end">
					    <a th:href="@{/horario/nuevo}" class="btn btn-primary mb-3">Nuevo Horario</a>
				</div>
			</div>
		</div>
        <div class="table-responsive">
            <table class="table table-vcenter card-table">
                <thead>
                    <tr>
                        <th class="border-end">Hora inicio</th>
                        <th class="border-end">Hora fin</th>
                        <th class="border-end">Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="horario : ${horarios}">
                        <td class="border-end align-middle fw-semibold" 
                        	th:text="${horario.hrInicio}"></td>
                        <td class="border-end align-middle fw-semibold"
                        	th:text="${horario.hrFin}"></td>
                        <td class="sort-nombre border-end align-middle text-secondary"
                        	th:text="${horario.hrEstado}"></td>
                        
                        <td class="text-center align-middle">
            <div class="d-inline-flex align-items-center gap-4">

                <a
                    th:href="@{/horario/editar/{id}(id=${horario.idHorarioRetiro})}"
                    class="btn btn-sm btn-outline-primary"
                    title="Editar Horario de Retiro">

                    <img
                        th:src="@{/core/dist/icons/edit.svg}"
                        width="20"
                        height="20"
                        alt="Editar">
                </a>

                <form
				    th:action="@{/horario/eliminar/{id}
				        (id=${horario.idHorarioRetiro})}"
				    method="post"
				    class="d-inline">
				
				    <button
				        type="submit"
				        class="btn btn-sm btn-outline-danger"
				        title="Desactivar Horario ed Retiro"
				        onclick="return confirm(
				            '¿Deseas desactivar este Horario??'
				        )">
				
				        <img
				            th:src="@{/core/dist/icons/trash.svg}"
				            width="20"
				            height="20"
				            alt="Desactivar">
				
				    </button>
				
				</form>
            </div>
        </td>
                        
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</html>
