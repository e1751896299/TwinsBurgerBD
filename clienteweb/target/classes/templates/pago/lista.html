<!DOCTYPE html>
<html
xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layouts/principal}">

<div layout:fragment="contenido">

    <h1>Bienvenido</h1>

    <div class="card">
    <div class="card-header">
			<div class="row align-items-center g-3 w-100">
				<div class="col-12 col-lg-3">
					<h3 class="card-title mb-0">
						Pagos
					</h3>
					<p class="text-secondary m-0">
						Lista de pagos
					</p>
				</div>

				<div class="col-12 col-lg-6">
					<div class="d-flex justify-content-center">
						<div class="input-group input-group-flat w-100" style="max-width: 420px;">
							<span class="input-group-text">
								<!-- Download SVG icon from http://tabler.io/icons/icon/search -->
	<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-1"><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>
							</span>

							<input id="advanced-table-search" type="text" class="form-control"
								placeholder="Buscar por # pedido..." aria-label="Buscar pago"
								autocomplete="off">
						</div>
					</div>
				</div>
			</div>
		</div>
    
    
        <div class="table-responsive">
            <table class="table table-vcenter card-table">
                <thead>
                    <tr>
						<th class="border-end">N° de pedido</th>
                        <th class="border-end">Pago</th>
                        <th class="border-end">Fecha</th>
                        <th class="border-end">Monto</th>
                        <th class="border-end">Método de pago</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pago : ${pagos}">
							
						<!-- Aqui el id como identificador --> 
						<td class="sort-pedido border-end align-middle fw-semibold"
							th:text="${pago.idPedido > 0 ? 'PED-' + #numbers.formatInteger(pago.idPedido, 3) : 'Sin pedido'}"></td>
                        <td class="border-end align-middle"
                            th:text="${'PAG-' + #numbers.formatInteger(pago.idPago, 3)}"></td>
                    
                        <td  class="sort-fecha border-end align-middle"
							th:text="${pago.pagoFechaFormateada}"></td>
                        <td  class="sort-monto border-end align-middle"
                        	th:text="${pago.pagoMonto}"></td>
                        
                        <!-- Aqui iria el método de pago--> 
                        <td class="sort-metodo border-end align-middle"
                            th:text="${pago.metodoPago != null ? pago.metodoPago : 'No especificado'}"></td>
                        
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>



<script
    th:src="@{/core/dist/libs/list.js/dist/list.min.js}">
</script>

<script>
    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const contenedor =
                document.getElementById(
                    "advanced-table"
                );

            const cuerpoTabla =
                contenedor?.querySelector(
                    ".table-tbody"
                );

            if (!contenedor
                    || !cuerpoTabla
                    || typeof List === "undefined") {

                return;
            }

            const list = new List(
                "advanced-table",
                {
                    sortClass: "table-sort",
                    listClass: "table-tbody",

                    page: 10000,

                    valueNames: [
                    	"sort-pedido",
                        "sort-fecha",
                        "sort-monto",
                        "sort-metodo"
                    ]
                }
            );

            const searchInput =
                document.getElementById(
                    "advanced-table-search"
                );

            if (searchInput) {

                searchInput.addEventListener(
                    "input",
                    function () {

                        list.search(
                            searchInput.value
                        );
                    }
                );
            }
        }
    );
</script>

</html>
