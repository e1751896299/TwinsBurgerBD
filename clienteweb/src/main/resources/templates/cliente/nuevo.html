<!DOCTYPE html>
<html
xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layouts/principal}">

<div layout:fragment="contenido">

    <h1>Nuevo Cliente</h1>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/cliente}" th:object="${cliente}" method="post">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" th:field="*{cliNombre}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Apellido</label>
                    <input type="text" th:field="*{cliApellido}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo</label>
                    <input type="email" th:field="*{cliCorreo}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Telefono</label>
                    <input type="text" th:field="*{cliTelefono}" class="form-control">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" th:field="*{cliEstado}" class="form-check-input">
                    <label class="form-check-label">Estado</label>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
    </div>

</div>

</html>
