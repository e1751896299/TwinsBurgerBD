<!DOCTYPE html>
<html
xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layouts/principal}">

<div layout:fragment="contenido">

    <h1>Categorias</h1>

    <a th:href="@{/categoria/nuevo}" class="btn btn-primary mb-3">Nueva Categoria</a>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-vcenter card-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Descripcion</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="categoria : ${categorias}">
                        <td th:text="${categoria.categoriaNombre}"></td>
                        <td th:text="${categoria.categoriaDescripcion}"></td>
                        <td th:text="${categoria.categoriaEstado}"></td>
                        
                        <td>
    							<a th:href="@{/categoria/editar/{id}(id=${ctegoria.idCategoria})}">
        							<img src="/core/dist/icons/edit.svg" width="20" height="20">
    							</a>
							</td>

							<td>
    							<a th:href="@{/categoria/eliminar/{id}(id=${categoria.idCtegoria})}">
        							<img src="/core/dist/icons/trash.svg" width="20" height="20">
    							</a>
							</td>
                        
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</html>
