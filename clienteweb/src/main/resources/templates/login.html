<!DOCTYPE html>
<html
xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Iniciar sesion</title>
    <link rel="stylesheet" th:href="@{/core/dist/css/tabler.css}">
</head>
<body class="d-flex flex-column">

    <div class="page page-center">
        <div class="container container-tight py-4">
            <div class="text-center mb-4">
                <h1>Sistema de Gestion</h1>
            </div>
            <div class="card card-md">
                <div class="card-body">
                    <h2 class="h2 text-center mb-4">Iniciar sesion</h2>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <form th:action="@{/login}" method="post" autocomplete="off">
                        <div class="mb-3">
                            <label class="form-label">Correo</label>
                            <input type="email" name="correo" class="form-control" placeholder="tu@correo.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contrasena</label>
                            <input type="password" name="contrasena" class="form-control">
                        </div>
                        <div class="form-footer">
                            <button type="submit" class="btn btn-danger w-100">Ingresar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
