<!DOCTYPE html>
<html
xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layouts/principal}">

<div layout:fragment="contenido">

    <h1>Nuevo Administrador</h1>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/administrador}" th:object="${administrador}" method="post">
                <input type="hidden" th:field="*{idAdmin}">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" th:field="*{adminNombre}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Apellido</label>
                    <input type="text" th:field="*{adminApellido}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo</label>
                    <input type="email" th:field="*{adminCorreo}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" th:field="*{adminContrasena}" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
    </div>

</div>

</html>
