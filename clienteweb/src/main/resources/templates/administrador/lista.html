 <!DOCTYPE html>
<html
xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layouts/principal}">

<div layout:fragment="contenido">


    <div class="col-12">
		
    <h1>Bienvenido</h1>

<div class="card">
	<div>
		<div class="card-header">
			<div class="row align-items-center g-3 w-100">
				<div class="col-12 col-lg-3">
					<h3 class="card-title mb-0">
						Administradores
					</h3>
					<p class="text-secondary m-0">
						Lista de usuarios administradores
					</p>
				</div>

				<div class="col-12 col-lg-6">
					<div class="d-flex justify-content-center">
						<div class="input-group input-group-flat w-100" style="max-width: 420px;">
							<span class="input-group-text">
								<!-- Download SVG icon from http://tabler.io/icons/icon/search -->
	<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-1"><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>
							</span>

							<input id="advanced-table-search" type="text" class="form-control"
								placeholder="Buscar administrador..." aria-label="Buscar administrador"
								autocomplete="off">
						</div>
					</div>
				</div>

				<div class="col-12 col-lg-3 d-flex justify-content-center justify-content-lg-end">
					<a th:href="@{/administrador/nuevo}" class="btn btn-primary">
						Nuevo administrador
					</a>
				</div>
			</div>
		</div>

		<div id="advanced-table">
			<div class="table-responsive">
				<table class="table table-vcenter table-hover card-table text-nowrap">
					<thead>
						<tr>
								<th class="border-end">
										Nombre
								</th>
							
								<th class="border-end">
										Apellido
								</th>
							
								<th class="border-end">
										Correo
								</th>
							
								<th class="text-center">
										Acciones
								</th>
						
						</tr>
					</thead>

					<tbody class="table-tbody">
			
						<tr th:each="admin : ${administradores}">
						
						    <td
							    class="sort-nombre border-end align-middle fw-semibold"
							    th:text="${admin.adminNombre}">
							</td>
							
							<td
							    class="sort-apellido border-end align-middle"	
							    th:text="${admin.adminApellido}">
							</td>
							
							<td
							    class="sort-correo border-end align-middle text-secondary"
							    th:text="${admin.adminCorreo}">
							</td>
							
							<td class="text-center align-middle">
            <div class="d-inline-flex align-items-center gap-4">

                <a
                    th:href="@{/administrador/editar/{id}(id=${admin.idAdmin})}"
                    class="btn btn-sm btn-outline-primary"
                    title="Editar administrador">

                    <img
                        th:src="@{/core/dist/icons/edit.svg}"
                        width="20"
                        height="20"
                        alt="Editar">
                </a>

                <form
				    th:action="@{/administrador/eliminar/{id}
				        (id=${admin.idAdmin})}"
				    method="post"
				    class="d-inline">
				
				    <button
				        type="submit"
				        class="btn btn-sm btn-outline-danger"
				        title="Desactivar producto"
				        onclick="return confirm(
				            '¿Deseas desactivar este producto?'
				        )">
				
				        <img
				            th:src="@{/core/dist/icons/trash.svg}"
				            width="20"
				            height="20"
				            alt="Desactivar">
				
				    </button>
				
				</form>
            </div>
        </td>		
		</tr>
						
					</tbody>
				</table>
			</div>
		</div>
	</div>
</div>
</div>
</div>

<script
    th:src="@{/core/dist/libs/list.js/dist/list.min.js}">
</script>

<script>
    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const contenedor =
                document.getElementById(
                    "advanced-table"
                );

            const cuerpoTabla =
                contenedor?.querySelector(
                    ".table-tbody"
                );

            if (!contenedor
                    || !cuerpoTabla
                    || typeof List === "undefined") {

                return;
            }

            const list = new List(
                "advanced-table",
                {
                    sortClass: "table-sort",
                    listClass: "table-tbody",

                    page: 10000,

                    valueNames: [
                        "sort-nombre",
                        "sort-apellido",
                        "sort-correo"
                    ]
                }
            );

            const searchInput =
                document.getElementById(
                    "advanced-table-search"
                );

            if (searchInput) {

                searchInput.addEventListener(
                    "input",
                    function () {

                        list.search(
                            searchInput.value
                        );
                    }
                );
            }
        }
    );
</script>

</html>
