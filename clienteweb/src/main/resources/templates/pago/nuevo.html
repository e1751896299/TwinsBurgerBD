<!DOCTYPE html>
<html
xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layouts/principal}">

<div layout:fragment="contenido">

    <h1>Nuevo Pago</h1>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/pago}" th:object="${pago}" method="post">
                <input type="hidden" th:field="*{idPago}">
                <div class="mb-3">
                    <label class="form-label">Fecha</label>
                    <input type="datetime-local" th:field="*{pagoFecha}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Monto</label>
                    <input type="number" step="0.01" th:field="*{pagoMonto}" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
    </div>

</div>

</html>
