<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Iniciar sesión | Twins Burger</title>
  <link rel="icon" th:href="@{/favicon-dev.ico}" type="image/x-icon">
  <link rel="stylesheet" th:href="@{/core/dist/css/tabler.css}">
  <link rel="stylesheet" th:href="@{/core/dist/css/tabler-themes.css}">
  <link rel="stylesheet" th:href="@{/css/twinsburger.css}">
</head>
<body>
  <script th:src="@{/core/dist/js/tabler-theme.js}"></script>

  <div class="page page-center">
    <div class="container container-tight py-4">
      <div class="text-center mb-4">
        <a th:href="@{/login}" class="navbar-brand navbar-brand-autodark justify-content-center" aria-label="Twins Burger">
          <span class="fs-1 fw-bold text-primary">TWINS</span>
          <span class="fs-1 fw-bold text-orange ms-2">BURGER</span>
        </a>
      </div>

      <div class="card card-md">
        <div class="card-body">
          <h2 class="h2 text-center mb-4">Ingresa a tu cuenta</h2>

          <div th:if="${param.error}" class="alert alert-danger" role="alert">
            <div class="d-flex">
              <div>El correo o la contraseña son incorrectos.</div>
            </div>
          </div>
          <div th:if="${param.logout}" class="alert alert-success" role="alert">
            Tu sesión se cerró correctamente.
          </div>
          <div th:if="${param.registro}" class="alert alert-success" role="alert">
            Tu cuenta fue creada. Ya puedes iniciar sesión.
          </div>

          <form th:action="@{/login}" method="post" autocomplete="on">
            <div class="mb-3">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input id="correo" name="correo" type="email" class="form-control"
                     placeholder="nombre@correo.com" autocomplete="username" required autofocus>
            </div>

            <div class="mb-2">
              <label for="contrasena" class="form-label">Contraseña</label>
              <div class="input-group input-group-flat">
                <input id="contrasena" name="contrasena" type="password" class="form-control"
                       placeholder="Tu contraseña" autocomplete="current-password" required>
                <span class="input-group-text">
                  <button id="mostrar-contrasena" type="button" class="btn btn-link link-secondary p-0"
                          title="Mostrar contraseña" aria-label="Mostrar contraseña" aria-pressed="false">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round" class="icon icon-1">
                      <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path>
                      <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6"></path>
                    </svg>
                  </button>
                </span>
              </div>
            </div>

            <div class="mb-2">
              <label class="form-check">
                <input type="checkbox" class="form-check-input" name="remember-me">
                <span class="form-check-label">Recordarme en este dispositivo</span>
              </label>
            </div>

            <div class="form-footer">
              <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
            </div>
          </form>
        </div>
      </div>

      <div class="text-center text-secondary mt-3">
        ¿Todavía no tienes una cuenta?
        <a th:href="@{/registro}" tabindex="-1">Regístrate</a>
      </div>
    </div>
  </div>

  <script th:src="@{/core/dist/js/tabler.js}" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const boton = document.getElementById('mostrar-contrasena');
      const campo = document.getElementById('contrasena');

      boton.addEventListener('click', function () {
        const visible = campo.type === 'text';
        campo.type = visible ? 'password' : 'text';
        boton.setAttribute('aria-pressed', String(!visible));
        boton.setAttribute('title', visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
      });
    });
  </script>
</body>
</html>
