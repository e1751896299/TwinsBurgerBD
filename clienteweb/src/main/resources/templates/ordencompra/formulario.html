<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layouts/principal}">

<head>
	<meta charset="utf-8">
		<title>Formulario de orden de compra</title>
</head>
		<body>
			<div layout:fragment="contenido">
				<h1 class="page-title mb-3">Nueva orden de compra</h1>
					<div th:if="${param.sinProductos}" class="alert alert-warning">
						Selecciona al menos un producto con cantidad y precio mayor que cero.
					</div>
						<form th:action="@{/ordencompra}" th:object="${ordenCompra}" method="post" class="card">
							<div class="card-body">
								<input type="hidden" th:field="*{idOrdenCompra}">
									<div class="mb-3">
										<label class="form-label">
											Fecha
										</label>

										<input class="form-control" type="datetime-local" th:field="*{ocFecha}" required>
									</div>
								<div class="mb-3">
									<label class="form-label">
										Proveedor
									</label>
										<input class="form-control" th:field="*{ocProveedor}" required>
								</div>

									<h3>Productos a reponer</h3>
										<p class="text-secondary">
											Escribe 0 en cantidad si el producto no se compró en esta orden.
										</p>
								<div class="row row-cards">
									<div class="col-md-6" th:each="p : ${productos}">
										<div class="card card-sm">
											<div class="card-body d-flex align-items-center gap-2">
												<div>
													<strong th:text="${p.prodNombre}">
														Producto
													</strong>
														<div class="text-secondary" th:text="${'Stock actual: ' + p.prodStock}"></div>
												</div>
												<div class="ms-auto d-flex gap-2">
													<div>
														<label class="form-label small mb-0">Cantidad</label>
														<input class="form-control" style="width:90px" type="number" min="0" th:name="${'cantidad_' + p.idProducto}" value="0">
													</div>
													<div>
														<label class="form-label small mb-0">Precio unit.</label>
														<input class="form-control" style="width:100px" type="number" min="0" step="0.01" th:name="${'precio_' + p.idProducto}">
													</div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
							<div class="card-footer">
								<button class="btn btn-primary">
									Registrar orden de compra
								</button>
									<a class="btn btn-link" th:href="@{/ordencompra}">
										Cancelar
									</a>
							</div>
						</form>
					</div>
				</body>
</html>
