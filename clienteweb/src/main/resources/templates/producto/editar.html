<!DOCTYPE html>
<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/principal}">

<head>
    <meta charset="UTF-8">
    <title>Editar producto</title>
</head>

<body>

<div layout:fragment="contenido">

    <div class="page-header">
        <div class="container-xl">
            <h1 class="page-title">Editar producto</h1>
        </div>
    </div>

    <div class="page-body">
        <div class="container-xl">

            <div class="card">
                <div class="card-body">

                    <form
                        th:action="@{/producto/editar/{id}
                            (id=${producto.idProducto})}"
                        th:object="${producto}"
                        method="post">

                        <div class="mb-3">
                            <label class="form-label">
                                Código
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                th:value="${producto.idProducto}"
                                disabled>

                            <small class="form-hint">
                                El código lo genera la base de datos
                                y no puede modificarse.
                            </small>
                        </div>

                        <div class="mb-3">
                            <label
                                class="form-label"
                                for="prodNombre">
                                Nombre
                            </label>

                            <input
                                id="prodNombre"
                                type="text"
                                th:field="*{prodNombre}"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label
                                class="form-label"
                                for="prodDescripcion">
                                Descripción
                            </label>

                            <textarea
                                id="prodDescripcion"
                                th:field="*{prodDescripcion}"
                                class="form-control"
                                rows="3">
                            </textarea>
                        </div>

                        <div class="mb-3">
                            <label
                                class="form-label"
                                for="prodPrecio">
                                Precio
                            </label>

                            <div class="input-group">
                                <span class="input-group-text">$</span>

                                <input
                                    id="prodPrecio"
                                    type="number"
                                    th:field="*{prodPrecio}"
                                    class="form-control"
                                    min="0.01"
                                    step="0.01"
                                    required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label
                                class="form-label"
                                for="prodStock">
                                Stock
                            </label>

                            <input
                                id="prodStock"
                                type="number"
                                th:field="*{prodStock}"
                                class="form-control"
                                min="0"
                                step="1"
                                required>
                        </div>

                        <div class="mb-3">

						    <label
						        class="form-label"
						        for="idCategoria">
						        Categoría
						    </label>

						    <select
						        id="idCategoria"
						        th:field="*{idCategoria}"
						        class="form-select"
						        required>

						        <option value="">
						            Selecciona una categoría
						        </option>

						        <option
						            th:each="categoria : ${categorias}"
						            th:value="${categoria.idCategoria}"
						            th:text="${categoria.categoriaNombre}">
						            Categoría
						        </option>
						
						    </select>
						
</div>

                        <div class="mb-3">
                            <label
                                class="form-label"
                                for="prodImagen">
                                URL de la imagen
                            </label>

                            <input
                                id="prodImagen"
                                type="url"
                                th:field="*{prodImagen}"
                                class="form-control"
                                placeholder="https://ejemplo.com/producto.jpg">
                        </div>

                        <div
                            class="mb-3"
                            th:if="${producto.prodImagen != null
                                and !producto.prodImagen.isBlank()}">

                            <label class="form-label">
                                Vista previa
                            </label>

                            <img
                                th:src="${producto.prodImagen}"
                                th:alt="${producto.prodNombre}"
                                class="rounded border d-block"
                                style="width: 220px;
                                       height: 150px;
                                       object-fit: cover;">
                        </div>

                        <div class="d-flex gap-2">
                            <button
                                type="submit"
                                class="btn btn-primary">
                                Guardar cambios
                            </button>

                            <a
                                th:href="@{/producto}"
                                class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
